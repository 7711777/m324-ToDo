name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    container:
      image: node:22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: M324_PROJEKT_TODOLIST/frontend
        run: npm install

      - name: Build production bundle
        working-directory: M324_PROJEKT_TODOLIST/frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: M324_PROJEKT_TODOLIST/frontend/dist/

  build-backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest
    container:
      image: maven:3.9-eclipse-temurin-21

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        working-directory: M324_PROJEKT_TODOLIST/backend
        run: mvn package -B

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: M324_PROJEKT_TODOLIST/backend/target/*.war

  # --- Docker Images bauen und in die GitHub Container Registry pushen ---
  # Läuft nur beim Push auf main (nach dem Merge), nicht bei jedem PR.
  docker-frontend:
    name: Build & Push Frontend Image
    needs: build-frontend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: M324_PROJEKT_TODOLIST/frontend
          push: true
          tags: ghcr.io/7711777/m324-todo-frontend:latest

  docker-backend:
    name: Build & Push Backend Image
    needs: build-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: M324_PROJEKT_TODOLIST/backend
          push: true
          tags: ghcr.io/7711777/m324-todo-backend:latest
